name = "api"
main = "src/index.ts"
compatibility_date = "2024-11-11"

routes = [
  { pattern = "api.jptutoraiyamato.com", custom_domain = true }
]

# 毎日 17:00 UTC（メルボルンの午前 3〜4 時）に、保存期間が過ぎた手書きの写真を消す（src/services/handwriting-cleanup.ts）
[triggers]
crons = ["0 17 * * *"]

[vars]
VERTEX_AI_PROJECT_ID = "my-vertex-ai-production"
VERTEX_AI_REGION = "us-central1"
SUPABASE_URL = "https://ybquwzoreecxxbewjpdn.supabase.co"

[[kv_namespaces]]
binding = "YAMATO_KNOWLEDGE"
id = "c103e53760f94dabb2d9b4e4f915d036"

# クラスのライブゲームの部屋（src/live-game/room.ts）。1 ゲームに 1 つ
[[durable_objects.bindings]]
name = "LIVE_GAME"
class_name = "LiveGameRoom"

[[migrations]]
tag = "v1-live-game"
new_sqlite_classes = ["LiveGameRoom"]
